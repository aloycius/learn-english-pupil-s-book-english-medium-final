<section class="page29" aria-labelledby="pg029_n0002">
  <h1 class="page29-title" id="pg029_n0002" data-id="pg029_n0002">2. Practise greeting your teachers.</h1>

  <img class="scene morning" src="images/pg029_im001.jpg" data-id="pg029_im001" alt="Sarah greets her male teacher in the morning.">
  <img class="scene afternoon" src="images/pg029_im002.jpg" data-id="pg029_im002" alt="Sharifa greets her female teacher in the afternoon.">

  <svg class="tails" viewBox="0 0 535 750" preserveAspectRatio="none" aria-hidden="true">
    <!-- Sarah speaks to her teacher. -->
    <polygon points="137,115 150,115 249,212"/>

    <polygon points="397,151 410,151 327,168"/>
    <!-- Sarah answers. -->
    <polygon points="196,238 207,238 249,212"/>
    <!-- Sharifa greets her teacher. -->
    <polygon points="143,417 155,417 197,486"/>
    <!-- The female teacher replies. -->
    <polygon points="275,428 289,428 263,443"/>
    <!-- Sharifa describes her studies. -->
    <polygon points="145,534 158,534 197,486"/>
    <!-- The female teacher describes her work. -->
    <polygon points="339,530 352,530 263,443"/>
  </svg>

  <p class="speech s1" data-id="pg029_n0004">Good morning, sir.</p>

  <p class="speech s2">
    <span data-id="pg029_n0005">Good morning, Sarah.</span><br>
    <span data-id="pg029_n0006">Are you alright?</span>
  </p>

  <p class="speech s3" data-id="pg029_n0007">I am doing well,<br>thank you.</p>

  <p class="speech s4" data-id="pg029_n0009">Good afternoon,<br>madam.</p>

  <p class="speech s5">
    <span data-id="pg029_n0010">Good afternoon, Sharifa.</span><br>
    <span data-id="pg029_n0011">How have you been?</span>
  </p>

  <p class="speech s6">
    <span data-id="pg029_n0012">I have been busy<br>studying.</span><br>
    <span data-id="pg029_n0013">What about you?</span>
  </p>

  <p class="speech s7" data-id="pg029_n0014">I have been<br>busy teaching.</p>
