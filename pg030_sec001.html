  <h1 class="page30-title" id="pg030_n0002" data-id="pg030_n0002">3. Practise greeting your friends.</h1>

  <img class="scene morning" src="images/pg030_im001.jpg" data-id="pg030_im001" alt="Joshua and Rehema greet each other in the morning.">
  <img class="scene evening" src="images/pg030_im002.jpg" data-id="pg030_im002" alt="Edith and Ali greet each other in the evening.">

  <svg class="tails" viewBox="0 0 535 750" preserveAspectRatio="none" aria-hidden="true">
    <!-- Joshua greets Rehema. -->
    <polygon points="245,131 258,131 226,202"/>

    <polygon points="416,175 429,175 320,207"/>

    <!-- Edith greets Ali. -->
    <polygon points="143,429 156,429 194,484"/>
    <!-- Ali replies to Edith. -->

    <polygon points="278,632 291,632 190,520"/>
  </svg>

  <p class="speech s1" data-id="pg030_n0004">Hello Rehema! Great to see<br>you again. How are you?</p>

  <p class="speech s2" data-id="pg030_n0005">I am okay, thanks.<br>How are you doing,<br>Joshua?</p>

  <p class="speech s3" data-id="pg030_n0006">I am doing<br>great, thanks.</p>

  <p class="speech s4" data-id="pg030_n0008">Good evening, Ali.</p>

  <p class="speech s5" data-id="pg030_n0009">Good evening, Edith.<br>How is your day?</p>

  <p class="speech s6" data-id="pg030_n0010">It is great. Thank you<br>for asking.</p>
