  <h1 class="page31-title" id="pg031_n0002" data-id="pg031_n0002">4. Practise greeting your parents.</h1>

  <img class="scene morning" src="images/pg031_im001.jpg" data-id="pg031_im001" alt="John greets his mother in the morning.">
  <img class="scene afternoon" src="images/pg031_im002.jpg" data-id="pg031_im002" alt="Ashura greets her father in the afternoon.">

  <svg class="tails" viewBox="0 0 535 750" preserveAspectRatio="none" aria-hidden="true">

    <polygon points="145,135 158,135 224,228"/>

  </svg>

  <p class="speech s1" data-id="pg031_n0004">Good morning,<br>mother.</p>

  <p class="speech s2" data-id="pg031_n0005">Good morning, John.<br>How are you?</p>

  <p class="speech s3" data-id="pg031_n0006">I am fine,<br>thank you.</p>

  <p class="speech s4" data-id="pg031_n0008">Good afternoon,<br>father.</p>

  <p class="speech s5" data-id="pg031_n0009">Good afternoon,<br>Ashura. How are<br>you doing?</p>

  <p class="speech s6" data-id="pg031_n0010">I am doing well,<br>thank you.</p>
